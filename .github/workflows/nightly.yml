name: Nightly Release

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-nightly:
    name: Build Nightly (Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies and build targets
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Package binary and generate checksum
        run: |
          mkdir -p dist
          tar -czf dist/dumprs-linux-x86_64.tar.gz -C target/release dumprs
          cd dist
          sha256sum dumprs-linux-x86_64.tar.gz > dumprs-linux-x86_64.tar.gz.sha256

      - name: Create or update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build (${{ steps.date.outputs.date }})"
          body: |
            Automated nightly build of **dumprs** for Linux x86_64.

            - **Commit**: `${{ github.sha }}`
            - **Build Date**: `${{ steps.date.outputs.date }}`

            > [!WARNING]
            > This is an automated experimental build. It may be unstable.
          prerelease: true
          make_latest: false
          files: |
            dist/dumprs-linux-x86_64.tar.gz
            dist/dumprs-linux-x86_64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
