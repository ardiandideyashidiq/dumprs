name: Nightly Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
    env:
      # Only applies when compiling for aarch64; ignored by the x86_64 job.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install AArch64 cross compiler
        if: matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache cargo dependencies and build targets
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify binary architecture
        run: |
          BIN="target/${{ matrix.target }}/release/dumprs"
          file "$BIN"
          case "${{ matrix.arch }}" in
            x86_64)  readelf -h "$BIN" | grep -q "Machine:.*Advanced Micro Devices X86-64" ;;
            aarch64) readelf -h "$BIN" | grep -q "Machine:.*AArch64" ;;
          esac

      - name: Package binary and generate checksum
        run: |
          mkdir -p dist
          tar -czf "dist/dumprs-linux-${{ matrix.arch }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" dumprs
          cd dist
          sha256sum "dumprs-linux-${{ matrix.arch }}.tar.gz" \
            > "dumprs-linux-${{ matrix.arch }}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dumprs-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish nightly release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dumprs-linux-*
          path: dist
          merge-multiple: true

      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Verify release assets
        run: ls -l dist

      - name: Create or update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build (${{ steps.date.outputs.date }})"
          body: |
            Automated nightly build of **dumprs** for Linux x86_64 and Linux AArch64 (arm64).

            - **Commit**: `${{ github.sha }}`
            - **Build Date**: `${{ steps.date.outputs.date }}`

            | Asset | Target |
            | :--- | :--- |
            | `dumprs-linux-x86_64.tar.gz` | `x86_64-unknown-linux-gnu` |
            | `dumprs-linux-aarch64.tar.gz` | `aarch64-unknown-linux-gnu` |

            > [!WARNING]
            > This is an automated experimental build. It may be unstable.
          prerelease: true
          make_latest: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
