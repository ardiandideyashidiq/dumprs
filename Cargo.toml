[package]
name = "dumprs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tracing = { version = "0.1", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "registry"] }
prost = "0.13"
brotli = "7.0"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "frame"] }
zip = { version = "2.2", default-features = false, features = ["deflate", "bzip2"] }
tar = "0.4"
flate2 = { version = "1.0", default-features = false, features = ["zlib-rs"] }
bzip2 = "0.4"
xz2 = "0.1"
sha2 = "0.10"
anyhow = "1.0"
walkdir = "2.5"
byteorder = "1.5"
zstd = "0.13"
sevenz-rust2 = "0.22"
erofs-rs = { version = "0.3", default-features = false, features = ["std", "lz4", "zstd"] }
ext4-view = { version = "1.0", features = ["std"] }
memmap2 = "0.9"
rayon = "1.10"
indicatif = "0.18"
tracing-indicatif = "0.3"
backhand = { version = "0.25.5", default-features = false, features = ["gzip", "zstd", "lz4", "parallel"] }

[build-dependencies]
prost = "0.13"
prost-build = "0.13"
prost-types = "0.13"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
debug = 1
opt-level = 3
